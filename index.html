<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Sensibilidad de Free Fire 2025</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>GENERADOR DE SENSIBILIDAD DE FREE FIRE 2025</h1>
  </header>
  <main>
    <form id="simulador-form">
      <label for="modelo">Escribe el modelo de tu celular:</label>
      <input type="text" id="modelo" name="modelo" placeholder="Ej: Mi celular X" required>
      <button type="button" id="simular">Simular</button>
    </form>
    <div id="resultado" hidden>
      <h2>Configuración de Sensibilidad:</h2>
      <ul>
        <li>General: <span id="general"></span></li>
        <li>Mira de punto rojo: <span id="rojo"></span></li>
        <li>Mira por 2X: <span id="dosX"></span></li>
        <li>Mira por 4X: <span id="cuatroX"></span></li>
        <li>AWM: <span id="awm"></span></li>
      </ul>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
